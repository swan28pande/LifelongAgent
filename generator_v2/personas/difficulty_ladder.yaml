# Difficulty knobs per user. Ranges are [min, max]; a null max means "or more".
# Rule types: `required` must appear in some regime, `allowed` is everything that may.

users:
  u1:
    level: 1
    preference_domains: 3
    rule_types: {required: [], allowed: [weekly_alternate, n_day_cycle, constant]}
    shifts_per_domain: [1, 1]
    visibility_mix: {explicit: 1.0, implicit: 0.0, uncaused: 0.0}
    lag_days: [0, 0]
    temporary_shifts: [0, 0]
    cross_domain_causes: 0
    distractors: 0
    exception_rate: 0.0
    p_session: 1.0
    p_mention: 1.0
